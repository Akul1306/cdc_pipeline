global:
  scrape_interval: 15s

scrape_configs:
  - job_name: connect
    static_configs:
      - targets: ["connect:9404"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: pipeline_monitor
    static_configs:
      - targets: ["host.docker.internal:8000"]
